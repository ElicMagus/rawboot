[package]
name = "rawboot-flasher"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
publish = false

# Two FEL-callable images that share the loader's drivers and the job/status
# contract in `rawboot-image`:
# - `rawboot-ddr-init` initialises DRAM and returns to the BROM;
# - `rawboot-flasher` is linked into DRAM, runs one job and returns to the BROM.
# Neither carries an eGON header (ADR-0013).
[dependencies]
rawboot-image = { path = "../rawboot-image", default-features = false }
# The loader's own SD/FAT drivers. The flasher enables the write path; the
# loader still builds `sunxi-drivers` without it (ADR-0005, ADR-0014).
sunxi-drivers = { path = "../sunxi-drivers", default-features = false, features = ["write"] }
sunxi-pl = { path = "../sunxi-pl" }
# The `FileSystem` type returned by `sunxi-drivers::fat`; the flasher only names
# it to write and verify files before unmounting.
fatfs = { version = "0.3.6", default-features = false, features = ["core_io"] }

[lib]
test = false
doctest = false

[[bin]]
name = "rawboot-ddr-init"
path = "src/bin/ddr_init.rs"
test = false
doctest = false

[[bin]]
name = "rawboot-flasher"
path = "src/bin/flasher.rs"
test = false
doctest = false
