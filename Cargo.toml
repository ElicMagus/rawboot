[workspace]
resolver = "3"
members = ["rawboot", "rawboot-rt", "rawboot-image", "payload", "xtask"]
# Vendored build-only shims, not workspace members.
exclude = ["vendor/core_io"]
# The xtask is a host tool and must not be built for the loader's bare-metal
# default target; keep it out of the default build.
default-members = ["rawboot", "rawboot-rt", "rawboot-image", "payload"]

# `fatfs` without `std` depends on `core_io` 0.1, whose generated source needs
# nightly features and no longer builds on stable Rust. The local shim carries
# only the `std::io` subset `fatfs` uses.
[patch.crates-io]
core_io = { path = "vendor/core_io" }

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = "s"
# `fatfs` pushes the loader close to its 64 KiB SRAM budget; LTO keeps enough
# headroom for the stack.
lto = true
