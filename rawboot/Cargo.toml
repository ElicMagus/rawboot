[package]
name = "rawboot"
version = "0.1.0"
edition = "2024"

[features]
# Link at the SD/SPI boot origin (0x00020000) instead of the FEL origin.
# `cargo xtask image` builds both variants; the FEL image is the default.
boot-sd = []

[dependencies]
rawboot-image = { path = "../rawboot-image", default-features = false }
rawboot-rt = { path = "../rawboot-rt" }
# The shared platform layer: GPIO and the MMIO accessors live there, the loader
# re-exports them under its own module names (ADR-0010).
sunxi-pl = { path = "../sunxi-pl" }
core_io = "0.1"
fatfs = { version = "0.3.6", default-features = false, features = ["core_io"] }
# The loader has no logger; compile fatfs's trace/debug calls out entirely.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }

[[bin]]
name = "rawboot"
path = "src/main.rs"
test = false
doctest = false
