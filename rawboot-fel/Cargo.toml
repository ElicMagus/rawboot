[package]
name = "rawboot-fel"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
publish = false

[dependencies]
# Pure-Rust USB access over usbfs/IOKit/WinUSB; no system libusb.
nusb = "0.2"
# The job/status contract and fixed DRAM addresses shared with the flasher.
rawboot-image = { path = "../rawboot-image", default-features = false }
